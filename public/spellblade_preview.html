<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spellblade Animation Studio</title>
<style>
  :root {
    --bg: var(--card, #131a2a);
    --text: var(--foreground, #f8fafc);
    --border-color: var(--border, #334155);
    --accent-color: var(--accent, #38bdf8);
  }
  body {
    margin: 0;
    padding: 16px;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    user-select: none;
  }
  .studio-container {
    display: flex;
    gap: 20px;
    background: var(--bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .viewport-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #0b101b;
    border: 2px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    position: relative;
  }
  canvas {
    image-rendering: pixelated;
    background: radial-gradient(circle at center, #1e293b 0%, #0b101b 80%);
    border-radius: 6px;
  }
  .controls-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 200px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .btn-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .compass-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: 140px;
    margin: 0 auto;
  }
  button {
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: #334155;
    border-color: var(--accent-color);
  }
  button.active {
    background: var(--accent-color);
    color: #030712;
    border-color: #7dd3fc;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }
  .info-tag {
    font-size: 11px;
    color: #38bdf8;
    font-family: monospace;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="studio-container">
  <div class="viewport-box">
    <canvas id="spriteCanvas" width="256" height="256"></canvas>
    <div id="statusTag" class="info-tag">STATE: IDLE | DIR: SOUTH-WEST | FRAME: 0</div>
  </div>

  <div class="controls-panel">
    <div>
      <div class="section-label">Animation State</div>
      <div class="btn-group">
        <button id="btn-Idle" class="active" onclick="setState('Idle')">Idle</button>
        <button id="btn-Run" onclick="setState('Run')">Run</button>
        <button id="btn-Attack" onclick="setState('Attack')">Attack</button>
        <button id="btn-Cast" onclick="setState('Cast')">Cast</button>
      </div>
    </div>

    <div>
      <div class="section-label" style="text-align: center;">8-Direction Compass</div>
      <div class="compass-grid">
        <button id="dir-north-west" onclick="setDir('north-west')">NW</button>
        <button id="dir-north" onclick="setDir('north')">N</button>
        <button id="dir-north-east" onclick="setDir('north-east')">NE</button>
        <button id="dir-west" onclick="setDir('west')">W</button>
        <div></div>
        <button id="dir-east" onclick="setDir('east')">E</button>
        <button id="dir-south-west" class="active" onclick="setDir('south-west')">SW</button>
        <button id="dir-south" onclick="setDir('south')">S</button>
        <button id="dir-south-east" onclick="setDir('south-east')">SE</button>
      </div>
    </div>

    <div>
      <div class="section-label">Speed</div>
      <div style="display:flex; gap:6px;">
        <button onclick="setFps(6)">0.5x</button>
        <button onclick="setFps(8)" class="active" id="fps-default">1.0x</button>
        <button onclick="setFps(12)">1.5x</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentState = 'Idle';
  let currentDir = 'south-west';
  let frame = 0;
  let fps = 8;
  let lastTime = 0;

  const canvas = document.getElementById('spriteCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const images = {};

  function preload() {
    const states = ['Idle', 'Run', 'Attack', 'Cast'];
    const dirs = ['south', 'south-west', 'west', 'north-west', 'north', 'north-east', 'east', 'south-east'];
    
    states.forEach(s => {
      dirs.forEach(d => {
        for (let f = 0; f < 4; f++) {
          const key = `${s}_${d}_${f}`;
          const img = new Image();
          img.src = `/assets/A_female_magic_swordsman_with/${s}/rotations/${d}_${f}.png`;
          images[key] = img;
        }
      });
    });
  }

  function setState(s) {
    currentState = s;
    frame = 0;
    ['Idle', 'Run', 'Attack', 'Cast'].forEach(st => {
      const el = document.getElementById(`btn-${st}`);
      if (el) el.classList.toggle('active', st === s);
    });
    updateStatus();
  }

  function setDir(d) {
    currentDir = d;
    const dirs = ['south', 'south-west', 'west', 'north-west', 'north', 'north-east', 'east', 'south-east'];
    dirs.forEach(dr => {
      const el = document.getElementById(`dir-${dr}`);
      if (el) el.classList.toggle('active', dr === d);
    });
    updateStatus();
  }

  function setFps(f) {
    fps = f;
  }

  function updateStatus() {
    document.getElementById('statusTag').innerText = 
      `STATE: ${currentState.toUpperCase()} | DIR: ${currentDir.toUpperCase()} | FRAME: ${frame}`;
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;
    const interval = 1000 / fps;

    if (elapsed > interval) {
      lastTime = timestamp - (elapsed % interval);
      frame = (frame + 1) % 4;
      updateStatus();
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const key = `${currentState}_${currentDir}_${frame}`;
    const img = images[key];

    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0);
    } else {
      // Fallback loader
      ctx.fillStyle = '#64748b';
      ctx.font = '12px monospace';
      ctx.fillText('Loading frame ' + frame + '...', 60, 130);
    }

    requestAnimationFrame(loop);
  }

  preload();
  requestAnimationFrame(loop);
</script>

</body>
</html>
