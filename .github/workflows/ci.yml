name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `verify` runs, in order:
      #   1. tsc --noEmit                     - strict type check
      #   2. vite build                       - production bundle + compiled Tailwind
      #   3. node --test tests/               - board data and escaping invariants
      #   4. check-css-coverage               - every utility class made it into the CSS
      - name: Verify
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seeded balance simulation
        run: node scripts/simulate-balance.mjs

      - name: Browser journeys and real WebRTC
        run: npm run test:e2e

      - name: Browser traces and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
            docs/quality-v3/balance-report.json
          retention-days: 14
